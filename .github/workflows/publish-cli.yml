name: "CLI: Publish to npm"

on:
  push:
    tags:
      - 'cli/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/ten-second-tom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#cli/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ten-second-tom@$VERSION"

      - name: Set package version
        run: |
          cd packages/cli
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm vitest run

      - name: Update npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          cd packages/cli
          pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#cli/v}"

          PREV_TAG=$(git tag --list "cli/v*" --sort=-version:refname | sed -n '2p')

          NOTES_START_FLAG=""
          if [ -n "$PREV_TAG" ]; then
            NOTES_START_FLAG="--notes-start-tag $PREV_TAG"
          fi

          gh release create "$TAG" \
            --title "Ten-Second Tom v${VERSION}" \
            --generate-notes \
            $NOTES_START_FLAG \
            --notes "Install or upgrade:
          \`\`\`bash
          npm install -g ten-second-tom@${VERSION}
          tom setup
          \`\`\`" \
            --latest=true \
            --verify-tag

  sync-version:
    name: Sync version to branch
    runs-on: ubuntu-latest
    needs: build-test-publish
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v2-rewrite
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#cli/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: |
          cd packages/cli
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync cli version to ${{ steps.version.outputs.version }} [skip ci]"
          git push
