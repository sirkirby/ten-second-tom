name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract version from tag
        id: extract
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack npm tarball
        working-directory: packages/cli
        run: npm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/cli/ten-second-tom-*.tgz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-tag, build-and-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-files

      - name: Generate release notes
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -50)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          {
            echo "## What's Changed"
            echo
            echo "$COMMITS"
            echo
            echo "## Install"
            echo
            echo '```bash'
            echo 'npm install -g ten-second-tom'
            echo 'tom setup'
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: v${{ needs.validate-tag.outputs.version }}
          body_path: release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    needs: [validate-tag, create-release]
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION"

      - name: Build
        run: pnpm build

      - name: Check npm package version
        id: npm-version
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: |
          if npm view "ten-second-tom@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ten-second-tom@$VERSION is already published"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: packages/cli
        run: npx npm@latest publish --provenance --access public

      - name: Publish summary
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          VERSION_EXISTS: ${{ steps.npm-version.outputs.exists }}
        run: |
          if [ "$VERSION_EXISTS" = "true" ]; then
            echo "## Package already published on npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Published to npmjs.org" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** [ten-second-tom](https://www.npmjs.com/package/ten-second-tom)" >> "$GITHUB_STEP_SUMMARY"
