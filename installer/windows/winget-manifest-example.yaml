# Example Winget Manifest for Ten Second Tom
#
# This is a reference for submitting to winget-pkgs after releasing a version
# with the new Inno Setup installer.
#
# To submit:
# 1. Release a new version (e.g., v0.10.0) which will create the installer
# 2. Get the SHA256 hash of the installer from the release artifacts
# 3. Update this template with the version and hash
# 4. Submit via: wingetcreate update SirKirby.TenSecondTom -v 0.10.0 -u <installer-url>
#
# Or manually create PR to https://github.com/microsoft/winget-pkgs

# --- installer.yaml ---
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: SirKirby.TenSecondTom
PackageVersion: "0.10.0"  # Update with actual version
InstallerType: inno
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
UpgradeBehavior: install
# Note: Winget does NOT auto-install dependencies, it only warns the user
# The app's error message tells users to run: winget install Gyan.FFmpeg
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Gyan.FFmpeg
      MinimumVersion: "6.0"
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/sirkirby/ten-second-tom/releases/download/v0.10.0/ten-second-tom-0.10.0-win-x64-setup.exe
    InstallerSha256: REPLACE_WITH_ACTUAL_SHA256_HASH
ManifestType: installer
ManifestVersion: 1.10.0

